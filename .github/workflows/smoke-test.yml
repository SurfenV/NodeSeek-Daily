name: 环境自检（临时）

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 准备 Chrome
        run: |
          set -euo pipefail
          google-chrome --version
          MAIN_VER="$(google-chrome --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_MAIN_VERSION=${MAIN_VER}" >> "$GITHUB_ENV"
      - name: 安装 Xvfb 与依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
      - name: 有头模式访问 NodeSeek
        run: |
          cat > smoke.py <<'PY'
          import os, time, undetected_chromedriver as uc
          uc.Chrome.__del__ = lambda self: None
          o = uc.ChromeOptions()
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1920,1080')
          kw = {"options": o}
          mv = os.environ.get("CHROME_MAIN_VERSION","").strip()
          if mv.isdigit(): kw["version_main"] = int(mv)
          print("启动 Chrome, version_main =", kw.get("version_main"))
          d = uc.Chrome(**kw)
          print("Chrome 启动成功:", d.capabilities.get("browserVersion"))
          d.get("https://www.nodeseek.com")
          time.sleep(8)
          print("URL   :", d.current_url)
          print("TITLE :", d.title)
          src = d.page_source
          d.save_screenshot("debug-smoke.png")
          open("debug-smoke.html","w",encoding="utf-8").write(src)
          blocked = any(k in src for k in ("Just a moment","cf-challenge","Checking your browser","Enable JavaScript and cookies"))
          has_posts = "post-list-item" in src
          print("被 Cloudflare 拦截:", blocked)
          print("拿到帖子列表  :", has_posts)
          try: d.quit()
          except Exception: pass
          raise SystemExit(1 if blocked or not has_posts else 0)
          PY
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ github.run_id }}
          path: debug-smoke.*
          if-no-files-found: ignore
