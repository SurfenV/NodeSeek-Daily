name: 签到入口探测（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 准备环境
        run: |
          set -euo pipefail
          MAIN_VER="$(google-chrome --version | grep -oE '[0-9]+' | head -1)"
          echo "CHROME_MAIN_VERSION=${MAIN_VER}" >> "$GITHUB_ENV"
          sudo apt-get update
          # 中文字体，否则截图里全是方块，没法看
          sudo apt-get install -y xvfb fonts-noto-cjk
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
      - name: 探测签到 API
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
        run: |
          cat > probe.py <<'PY'
          import os, time, json, undetected_chromedriver as uc
          uc.Chrome.__del__ = lambda self: None
          o = uc.ChromeOptions()
          for a in ('--no-sandbox','--disable-dev-shm-usage','--window-size=1920,1080'):
              o.add_argument(a)
          kw={"options":o}
          mv=os.environ.get("CHROME_MAIN_VERSION","").strip()
          if mv.isdigit(): kw["version_main"]=int(mv)
          d=uc.Chrome(**kw)
          d.get("https://www.nodeseek.com"); time.sleep(5)
          for it in os.environ["NS_COOKIE"].split(';'):
              try:
                  n,v=it.strip().split('=',1)
                  d.add_cookie({'name':n,'value':v,'domain':'.nodeseek.com','path':'/'})
              except Exception: pass
          d.refresh(); time.sleep(6)

          # 在已通过 Cloudflare 的页面上下文里发请求，自动带 cookie 和正确的 TLS 指纹
          js = """
          const cb = arguments[arguments.length - 1];
          fetch(arguments[0], {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include'})
            .then(r => r.text().then(t => cb(JSON.stringify({status:r.status, body:t.slice(0,600)}))))
            .catch(e => cb(JSON.stringify({error:String(e)})));
          """
          d.set_script_timeout(40)
          for path in ["/api/attendance?random=false",
                       "/api/attendance?random=true",
                       "/api/statistics/user-info"]:
              try:
                  r = json.loads(d.execute_async_script(js, path))
                  print(f"POST {path}\n   -> {r}\n")
              except Exception as e:
                  print(f"POST {path}\n   -> 异常 {e}\n")
              time.sleep(2)
          try: d.quit()
          except Exception: pass
          PY
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe-after-click.*
          if-no-files-found: ignore
