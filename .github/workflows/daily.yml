name: NodeSeek 每日签到

on:
  schedule:
    # UTC 16:37 = 北京时间 00:37。刻意避开整点：GitHub 的定时任务在整点
    # 排队最严重，经常延迟十几分钟甚至被丢弃。
    - cron: '37 16 * * *'
  workflow_dispatch:
    inputs:
      comment_count:
        description: '本次评论多少个帖子（0 = 只签到，不评论）'
        required: false
        default: '20'
      comment_batch:
        description: '每批评论几条（留空用仓库变量，默认 3）'
        required: false
      comment_interval:
        description: '每批之间停几秒（留空用仓库变量，默认 300）'
        required: false
      headless:
        description: '使用无头模式（true 容易被 Cloudflare 拦，排查时才用）'
        required: false
        default: 'false'
      debug:
        description: '保存每一步的截图和页面源码到 artifact'
        required: false
        default: 'false'

# 同一时间只允许一个实例在跑，避免手动触发和定时任务撞车导致重复评论。
concurrency:
  group: nodeseek-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # Cookie 临期时开 Issue 提醒
    # 20 条评论分 7 批、每批间隔 5 分钟，光等待就 30 分钟，整轮约 40~45 分钟。
    # 仓库是 public，Actions 时长免费，留足余量即可。
    timeout-minutes: 75

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 必须停在 3.11：undetected-chromedriver 3.5.5 仍在 import
          # distutils，而 Python 3.12 已将其移除，升级会直接 ImportError。
          python-version: '3.11'
          cache: 'pip'

      - name: 准备 Chrome 并取主版本号
        run: |
          set -euo pipefail
          # runner 镜像自带 Google Chrome，直接用。注意不要 apt install
          # chromium-browser：Ubuntu 22.04+ 上它是个 snap 转发包，CI 里没有
          # snapd，装完是坏的。
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "runner 未预装 Chrome，回落到官方源安装"
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
          MAIN_VER="$(google-chrome --version | grep -oE '[0-9]+' | head -1)"
          echo "Chrome 主版本: ${MAIN_VER}"
          echo "CHROME_MAIN_VERSION=${MAIN_VER}" >> "$GITHUB_ENV"

      - name: 安装 Xvfb 与中文字体
        run: |
          sudo apt-get update
          # 没有 CJK 字体的话，排查用的截图里中文全是方块
          sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # setuptools 为 uc 提供 distutils 兜底
          pip install --upgrade setuptools
          pip install -r requirements.txt

      - name: 执行签到（失败自动重试）
        id: run
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          # 用 variable 而非 secret：它不是敏感信息，设成 secret 会让 GitHub
          # 把日志里所有 "false" 字样都打码成 ***，反而没法读日志
          NS_RANDOM: ${{ vars.NS_RANDOM || 'false' }}
          NS_COMMENT_COUNT: ${{ github.event.inputs.comment_count || vars.NS_COMMENT_COUNT || '20' }}
          NS_COMMENT_BATCH: ${{ github.event.inputs.comment_batch || vars.NS_COMMENT_BATCH || '3' }}
          NS_COMMENT_INTERVAL: ${{ github.event.inputs.comment_interval || vars.NS_COMMENT_INTERVAL || '300' }}
          NS_CHICKEN_COUNT: ${{ vars.NS_CHICKEN_COUNT || '2' }}
          # 关键：跑在 Xvfb 上的「有头」Chrome。无头 Chrome 的指纹会被
          # NodeSeek 前面的 Cloudflare 挡下，这是原配置最大的不稳定来源。
          HEADLESS: ${{ github.event.inputs.headless || 'false' }}
          NS_DEBUG: ${{ github.event.inputs.debug || 'false' }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ vars.BARK_GROUP || 'NodeSeek' }}
        run: |
          set -uo pipefail
          if [ -z "${NS_COOKIE}" ]; then
            echo "::error::未配置 NS_COOKIE，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "::group::第 ${attempt} 次尝试"
            # 最后一次尝试才允许推送失败通知，否则重试会连发 3 条
            if [ $attempt -eq 3 ]; then
              export NS_NOTIFY_FAILURE=1
            fi
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              python nodeseek_daily.py
            code=$?
            echo "::endgroup::"

            if [ $code -eq 0 ]; then
              echo "✅ 第 ${attempt} 次尝试成功"
              exit 0
            fi

            if [ $code -eq 2 ]; then
              echo "::error::Cookie 已失效，重试无意义。请重新登录 NodeSeek 并更新 Secret NS_COOKIE"
              exit 2
            fi

            echo "⚠️ 第 ${attempt} 次尝试失败（退出码 ${code}）"
            if [ $attempt -lt 3 ]; then
              # 退避等待，多数失败是 Cloudflare 的临时质询
              sleep $((attempt * 45))
            fi
          done

          echo "::error::三次尝试均失败，请检查 NS_COOKIE 是否过期"
          exit 1

      # GitHub 只在 job 失败时发邮件，Actions 摘要里的 warning 不会触达用户。
      # Cookie 一旦过期签到就持续失败，所以临期时开 Issue（owner 默认订阅
      # 自己仓库的 Issue，会收到邮件），更新后再自动关掉，形成闭环。
      - name: Cookie 临期提醒
        if: always() && steps.run.outputs.cookie_days != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ steps.run.outputs.cookie_days }}
          EXPIRY: ${{ steps.run.outputs.cookie_expiry }}
          EXPIRING: ${{ steps.run.outputs.cookie_expiring }}
        # 提醒失败不能拖垮主流程：签到成功就该是成功。
        continue-on-error: true
        run: |
          set -uo pipefail
          TITLE="NS_COOKIE 即将过期，请更新"
          EXISTING="$(gh issue list -R "$REPO" --state open \
            --search "in:title $TITLE" --json number -q '.[0].number // empty')"

          if [ "$EXPIRING" != "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" -R "$REPO" \
                -c "Cookie 已更新，新的到期日为 ${EXPIRY}（还有 ${DAYS} 天）。"
              echo "Cookie 已更新，关闭提醒 Issue #${EXISTING}"
            else
              echo "Cookie 剩余 ${DAYS} 天，无需提醒"
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            echo "已有提醒 Issue #${EXISTING}，不重复创建"
            exit 0
          fi

          # 用带引号的 heredoc 写模板，内容完全字面化（正文里的反引号不会
          # 被当成命令替换），动态值随后用 sed 填进占位符。
          cat > issue-body.md <<'MDEOF'
          NodeSeek 的登录态将于 **__EXPIRY__ UTC** 过期（约 __DAYS__ 天后）。

          有效期是服务端固定的 30 天，且不做滑动续期，到期只能重新登录换一份。
          过期后签到会持续失败。

          ## 更新步骤

          1. 用**隐私窗口**登录 NodeSeek（避免影响日常浏览器的登录态）
          2. 用 Cookie-Editor / EditThisCookie 导出 JSON
             （注意别过滤掉 httpOnly，`session` 就是 httpOnly 的）
          3. 本地执行：

             ```bash
             cd ~/NodeSeek-Daily
             python3 scripts/update_cookie.py cookies.json
             ```

          4. 验证：

             ```bash
             gh workflow run daily.yml -R __REPO__ -f comment_count=0
             ```

          更新成功后，下一次运行会自动关闭本 Issue。
          MDEOF

          sed -i "s|__EXPIRY__|${EXPIRY}|g; s|__DAYS__|${DAYS}|g; s|__REPO__|${REPO}|g" issue-body.md
          gh issue create -R "$REPO" -t "$TITLE" -F issue-body.md
          echo "已创建提醒 Issue"

      - name: 上传现场（失败或开了 debug 时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            debug-*.png
            debug-*.html
          retention-days: 7
          if-no-files-found: ignore
